services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    # .env が存在する場合のみ読み込む（AI キー等）
    env_file:
      - path: .env
        required: false
    environment:
      # Docker 環境用の固定値（.env の同名設定より優先）
      API_HOST: "0.0.0.0"
      API_PORT: "8080"
      DATABASE_URL: "sqlite:////data/incidents.db"
      AI_RAG_PATH: "/data/.chromadb"
      TOPOLOGY_PATH: "configs/clos/yang_topology.yaml"
      TOPOLOGY_SOURCE: "iida-yaml"
      SKB_PATH: "configs/syslog_knowledge"
      AUTH_ENABLED: "true"
      CORS_ORIGINS: "http://localhost:3000"
    volumes:
      - ./configs:/app/configs:ro  # トポロジー定義（読み取り専用）
      - data:/data                  # incidents.db と .chromadb を永続化
    ports:
      - "1514:1514/udp"             # Syslog UDP（実機からは 514:1514/udp に変更）
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
