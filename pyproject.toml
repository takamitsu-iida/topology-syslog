[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topology-syslog"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.3",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "httpx>=0.27",
    "openai>=1.0",
    "chromadb>=0.5",
    "pyats>=24.0",
    "genie>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
topology-syslog = "topology_syslog.__main__:main"
topology-syslog-node-monitor = "topology_syslog.node_monitor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["topology_syslog*"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
