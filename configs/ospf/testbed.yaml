# pyATS testbed YAML — agentic-ni-clos
#
# 【接続方式】
#   Ubuntu (192.168.100.1) と全装置を独立した OOB 管理 LAN に収容し、
#   OSPF ファブリックを経由せず各装置の管理 IP へ SSH 接続する。
#
# 【認証情報】
#   全装置共通: username cisco / password cisco (privilege 15 直付け)
#   enable パスワードも同じく cisco
#   本番環境では変更すること。環境変数で渡す場合は %ENV{VAR_NAME} 記法が使える。
#
# 管理 IP アドレス体系 (cml_lab.yaml より):
#   Spine1 : 192.168.100.11    Spine2 : 192.168.100.12
#   Leaf1  : 192.168.100.21    Leaf2  : 192.168.100.22    Leaf3 : 192.168.100.23

testbed:
  name: agentic-ni-clos
  credentials:
    default:
      username: cisco
      password: cisco
    enable:
      password: cisco

devices:

  Spine1:
    os: iosv
    type: router
    connections:
      cli:
        protocol: ssh
        ip: 192.168.100.11
        port: 22

  Spine2:
    os: iosv
    type: router
    connections:
      cli:
        protocol: ssh
        ip: 192.168.100.12
        port: 22

  Leaf1:
    os: iosv
    type: router
    connections:
      cli:
        protocol: ssh
        ip: 192.168.100.21
        port: 22

  Leaf2:
    os: iosv
    type: router
    connections:
      cli:
        protocol: ssh
        ip: 192.168.100.22
        port: 22

  Leaf3:
    os: iosv
    type: router
    connections:
      cli:
        protocol: ssh
        ip: 192.168.100.23
        port: 22
