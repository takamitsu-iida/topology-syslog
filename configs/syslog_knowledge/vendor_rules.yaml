# Vendor-specific SYSLOG knowledge pack.
#
# 目的:
# - Cisco IOS/NX-OS, Juniper Junos, Arista EOS, Fortinet FortiOS,
#   Palo Alto PAN-OS, Yamaha RTX, NEC IX, Allied Telesis AW+ の代表的な
#   ネットワーク障害・復旧・設定変更イベントを SKB で正規化する。
# - まずは安全な初期ルールとして、障害シグナル / 二次影響 / 復旧 / 保存のみを分類する。

rules:
  # Cisco IOS / NX-OS -------------------------------------------------------
  - id: cisco-nxos-ethpm-link-flap
    description: "Cisco NX-OS の Ethernet ポート状態変化。物理リンク障害の root cause 候補として扱う。"
    vendor: cisco-ios
    signature: "%ETHPORT-*-IF_DOWN_*"
    classification: link-state-change
    correlation_role: root-cause-candidate
    severity_policy:
      "0-2": page_immediately
      "3-4": create_incident
      "5": correlate_only
      "6-7": retain_only
    runbook:
      - "show interface <interface>"
      - "show logging last 100 | include <interface>"
    status: approved
    confidence: 0.9
    priority: 95

  - id: cisco-stp-topology-change
    description: "Cisco の STP トポロジー変更。単独では二次影響または相関証跡として扱う。"
    vendor: cisco-ios
    signature: "%SPANTREE-*-TOPO_CHG"
    classification: stp-topology-change
    correlation_role: secondary-impact
    severity_policy:
      "0-3": create_incident
      "4-5": correlate_only
      "6-7": retain_only
    runbook:
      - "show spanning-tree detail"
      - "show logging | include SPANTREE"
    status: approved
    confidence: 0.85
    priority: 85

  - id: cisco-lacp-neighbor-down
    description: "Cisco の LACP 隣接または bundle member 障害。リンク冗長性低下として扱う。"
    vendor: cisco-ios
    signature: "%LACP-*-*"
    classification: lacp-state-change
    correlation_role: secondary-impact
    severity_policy:
      "0-3": create_incident
      "4-5": correlate_only
      "6-7": retain_only
    runbook:
      - "show etherchannel summary"
      - "show lacp neighbor"
    status: approved
    confidence: 0.85
    priority: 80

  # Juniper Junos ----------------------------------------------------------
  - id: junos-bgp-neighbor-down
    description: "Juniper Junos の BGP neighbor down。上流リンクまたは対向装置障害の二次影響として扱う。"
    vendor: juniper-junos
    signature: "RPD_BGP_NEIGHBOR_STATE_CHANGED*<ip>*DOWN*"
    classification: bgp-adjacency-change
    correlation_role: secondary-impact
    severity_policy:
      "0-3": create_incident
      "4-5": correlate_only
      "6-7": retain_only
    runbook:
      - "show bgp summary"
      - "show route protocol bgp"
    status: approved
    confidence: 0.85
    priority: 90

  - id: junos-link-down
    description: "Juniper Junos のインターフェース down。物理リンク障害の root cause 候補として扱う。"
    vendor: juniper-junos
    signature: "SNMP_TRAP_LINK_DOWN*"
    classification: link-state-change
    correlation_role: root-cause-candidate
    severity_policy:
      "0-2": page_immediately
      "3-4": create_incident
      "5": correlate_only
      "6-7": retain_only
    runbook:
      - "show interfaces terse"
      - "show interfaces extensive <interface>"
    status: approved
    confidence: 0.9
    priority: 95

  - id: junos-commit
    description: "Juniper Junos の commit 通知。設定変更監査として保存し、インシデントは作成しない。"
    vendor: juniper-junos
    signature: "UI_COMMIT*"
    classification: configuration-change
    correlation_role: informational
    severity_policy:
      "0-7": retain_only
    runbook:
      - "show system commit"
      - "show configuration | compare rollback 1"
    status: approved
    confidence: 0.95
    priority: 90

