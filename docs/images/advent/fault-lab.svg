<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">Fault injection lab cycle</title>
  <desc id="desc">A four-step cycle injects a network fault, observes SYSLOG, evaluates root cause analysis, and restores the network.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172033"/>
      <stop offset="1" stop-color="#24314d"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#93a4c3"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#080c16" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="960" height="480" rx="28" fill="url(#bg)"/>
  <text x="48" y="65" fill="#f4f7f6" font-family="system-ui, sans-serif" font-size="24" font-weight="700">Break the network. Train the detective.</text>

  <g fill="none" stroke="#93a4c3" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M244 238h62"/>
    <path d="M470 238h62"/>
    <path d="M696 238h62"/>
    <path d="M849 355c-28 80-645 83-730-5"/>
  </g>

  <g font-family="system-ui, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(48 132)">
      <rect width="196" height="216" rx="22" fill="#f7f9fc"/>
      <circle cx="98" cy="74" r="43" fill="#fde2e4"/>
      <path d="M62 75h72M91 65l15 19 15-19" fill="none" stroke="#ef6b73" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="98" y="144" fill="#27344e" font-size="20" font-weight="800">1. INJECT</text>
      <text x="98" y="174" fill="#66738d" font-size="15">stop a node or link</text>
    </g>
    <g transform="translate(274 132)">
      <rect width="196" height="216" rx="22" fill="#f7f9fc"/>
      <circle cx="98" cy="74" r="43" fill="#fff1bd"/>
      <path d="M71 56h54v38H71zM80 105h36" fill="none" stroke="#d7a800" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M80 68h36M80 81h25" stroke="#d7a800" stroke-width="5" stroke-linecap="round"/>
      <text x="98" y="144" fill="#27344e" font-size="20" font-weight="800">2. OBSERVE</text>
      <text x="98" y="174" fill="#66738d" font-size="15">collect SYSLOG</text>
    </g>
    <g transform="translate(500 132)">
      <rect width="196" height="216" rx="22" fill="#f7f9fc"/>
      <circle cx="98" cy="74" r="43" fill="#dce8fa"/>
      <circle cx="90" cy="67" r="22" fill="none" stroke="#4d78b8" stroke-width="7"/>
      <path d="M106 84l20 20" stroke="#4d78b8" stroke-width="8" stroke-linecap="round"/>
      <text x="98" y="144" fill="#27344e" font-size="20" font-weight="800">3. EVALUATE</text>
      <text x="98" y="174" fill="#66738d" font-size="15">compare RCA to truth</text>
    </g>
    <g transform="translate(726 132)">
      <rect width="186" height="216" rx="22" fill="#f7f9fc"/>
      <circle cx="93" cy="74" r="43" fill="#c9f3e7"/>
      <path d="M64 76l18 18 39-44" fill="none" stroke="#20a884" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="93" y="144" fill="#27344e" font-size="20" font-weight="800">4. RESTORE</text>
      <text x="93" y="174" fill="#66738d" font-size="15">recover and repeat</text>
    </g>
  </g>
  <text x="480" y="437" text-anchor="middle" fill="#c8d1e2" font-family="system-ui, sans-serif" font-size="17">ground truth + logs + incidents = measurable RCA</text>
</svg>
