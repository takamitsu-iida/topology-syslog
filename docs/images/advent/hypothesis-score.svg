<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">Hypothesis scoring</title>
  <desc id="desc">Three root cause hypotheses are scored, and the physical link failure wins because it explains the evidence best.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172033"/>
      <stop offset="1" stop-color="#24314d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#080c16" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="960" height="480" rx="28" fill="url(#bg)"/>
  <text x="48" y="65" fill="#f4f7f6" font-family="system-ui, sans-serif" font-size="24" font-weight="700">Which hypothesis explains the evidence best?</text>

  <g font-family="system-ui, sans-serif" filter="url(#shadow)">
    <g transform="translate(48 111)">
      <rect width="264" height="296" rx="20" fill="#f7f9fc"/>
      <circle cx="132" cy="63" r="30" fill="#dbe1ec"/>
      <path d="M115 63h34M132 46v34" stroke="#66738d" stroke-width="6" stroke-linecap="round"/>
      <text x="132" y="120" text-anchor="middle" fill="#27344e" font-size="20" font-weight="800">Device failure</text>
      <text x="132" y="151" text-anchor="middle" fill="#66738d" font-size="15">Spine1</text>
      <g transform="translate(28 186)">
        <rect width="208" height="14" rx="7" fill="#dbe1ec"/>
        <rect width="119" height="14" rx="7" fill="#93a4c3"/>
        <text x="0" y="-10" fill="#66738d" font-size="14">coverage</text>
        <rect y="46" width="208" height="14" rx="7" fill="#dbe1ec"/>
        <rect y="46" width="91" height="14" rx="7" fill="#93a4c3"/>
        <text x="0" y="36" fill="#66738d" font-size="14">specificity</text>
      </g>
      <text x="132" y="278" text-anchor="middle" fill="#66738d" font-size="28" font-weight="800">0.57</text>
    </g>

    <g transform="translate(348 111)">
      <rect width="264" height="296" rx="20" fill="#f7f9fc"/>
      <circle cx="132" cy="63" r="30" fill="#dbe1ec"/>
      <path d="M108 63h48" stroke="#66738d" stroke-width="7" stroke-linecap="round"/>
      <circle cx="114" cy="63" r="9" fill="#66738d"/>
      <text x="132" y="120" text-anchor="middle" fill="#27344e" font-size="20" font-weight="800">Interface failure</text>
      <text x="132" y="151" text-anchor="middle" fill="#66738d" font-size="15">Leaf1 Gi0/0</text>
      <g transform="translate(28 186)">
        <rect width="208" height="14" rx="7" fill="#dbe1ec"/>
        <rect width="143" height="14" rx="7" fill="#93a4c3"/>
        <text x="0" y="-10" fill="#66738d" font-size="14">coverage</text>
        <rect y="46" width="208" height="14" rx="7" fill="#dbe1ec"/>
        <rect y="46" width="158" height="14" rx="7" fill="#93a4c3"/>
        <text x="0" y="36" fill="#66738d" font-size="14">specificity</text>
      </g>
      <text x="132" y="278" text-anchor="middle" fill="#66738d" font-size="28" font-weight="800">0.71</text>
    </g>

    <g transform="translate(648 91)">
      <rect width="264" height="336" rx="20" fill="#f7f9fc" stroke="#36c7a1" stroke-width="6"/>
      <path d="M179 0h61a24 24 0 0124 24v44z" fill="#36c7a1"/>
      <path d="M210 27l9 9 18-21" fill="none" stroke="#172033" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="132" cy="83" r="30" fill="#c9f3e7"/>
      <path d="M107 83h50M126 75l12 16 13-16" fill="none" stroke="#20a884" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="132" y="140" text-anchor="middle" fill="#27344e" font-size="20" font-weight="800">Physical link</text>
      <text x="132" y="171" text-anchor="middle" fill="#20a884" font-size="15" font-weight="700">Leaf1 -- Spine1</text>
      <g transform="translate(28 206)">
        <rect width="208" height="14" rx="7" fill="#dbe1ec"/>
        <rect width="193" height="14" rx="7" fill="#36c7a1"/>
        <text x="0" y="-10" fill="#66738d" font-size="14">coverage</text>
        <rect y="46" width="208" height="14" rx="7" fill="#dbe1ec"/>
        <rect y="46" width="187" height="14" rx="7" fill="#36c7a1"/>
        <text x="0" y="36" fill="#66738d" font-size="14">specificity</text>
      </g>
      <text x="132" y="318" text-anchor="middle" fill="#20a884" font-size="34" font-weight="900">0.92</text>
    </g>
  </g>
</svg>
