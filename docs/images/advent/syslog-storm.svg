<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">Many SYSLOG messages point to one root cause</title>
  <desc id="desc">Four alert messages are grouped into one physical link failure by topology-aware root cause analysis.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172033"/>
      <stop offset="1" stop-color="#24314d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#080c16" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#93a4c3"/>
    </marker>
  </defs>
  <rect width="960" height="480" rx="28" fill="url(#bg)"/>
  <circle cx="60" cy="58" r="5" fill="#36c7a1"/>
  <circle cx="82" cy="58" r="5" fill="#f2c94c"/>
  <circle cx="104" cy="58" r="5" fill="#ef6b73"/>
  <text x="138" y="67" fill="#f4f7f6" font-family="system-ui, sans-serif" font-size="24" font-weight="700">SYSLOG storm</text>

  <g filter="url(#shadow)" font-family="ui-monospace, monospace" font-size="17">
    <g transform="translate(48 112)">
      <rect width="330" height="58" rx="12" fill="#f7f9fc"/>
      <rect width="9" height="58" rx="5" fill="#ef6b73"/>
      <text x="29" y="36" fill="#27344e">Leaf1  Gi0/0 down</text>
    </g>
    <g transform="translate(48 184)">
      <rect width="330" height="58" rx="12" fill="#f7f9fc"/>
      <rect width="9" height="58" rx="5" fill="#ef6b73"/>
      <text x="29" y="36" fill="#27344e">Spine1 Gi0/0 down</text>
    </g>
    <g transform="translate(48 256)">
      <rect width="330" height="58" rx="12" fill="#f7f9fc"/>
      <rect width="9" height="58" rx="5" fill="#f2c94c"/>
      <text x="29" y="36" fill="#27344e">Leaf1  BGP down</text>
    </g>
    <g transform="translate(48 328)">
      <rect width="330" height="58" rx="12" fill="#f7f9fc"/>
      <rect width="9" height="58" rx="5" fill="#f2c94c"/>
      <text x="29" y="36" fill="#27344e">Spine1 BGP down</text>
    </g>
  </g>

  <path d="M406 249h98" fill="none" stroke="#93a4c3" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="422" y="226" fill="#c8d1e2" font-family="system-ui, sans-serif" font-size="17">topology + RCA</text>

  <g filter="url(#shadow)">
    <rect x="540" y="103" width="370" height="292" rx="24" fill="#f7f9fc"/>
    <rect x="540" y="103" width="370" height="62" rx="24" fill="#36c7a1"/>
    <path d="M540 141h370v24H540z" fill="#36c7a1"/>
    <text x="572" y="143" fill="#112239" font-family="system-ui, sans-serif" font-size="22" font-weight="800">ONE INCIDENT</text>

    <g stroke="#7284a4" stroke-width="5" stroke-linecap="round">
      <path d="M638 247h165"/>
      <path d="M713 239l17 16 17-16" stroke="#ef6b73" stroke-width="8"/>
    </g>
    <g fill="#27344e">
      <rect x="578" y="211" width="78" height="70" rx="14"/>
      <rect x="785" y="211" width="88" height="70" rx="14"/>
    </g>
    <g fill="#f4f7f6" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
      <text x="617" y="251">Leaf1</text>
      <text x="829" y="251">Spine1</text>
    </g>
    <text x="725" y="316" text-anchor="middle" fill="#ef6b73" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Physical link failure</text>
    <text x="725" y="351" text-anchor="middle" fill="#66738d" font-family="system-ui, sans-serif" font-size="16">4 messages, 1 root cause candidate</text>
  </g>
</svg>
